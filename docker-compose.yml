services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ALLOWED_ORIGIN: http://localhost:5173
    volumes:
      - kanban-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  kanban-data:
